<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<style>{{style}}</style>
</head>
<body>
  <div id="empty" class="empty-state">
    <div class="empty-title">No page connected</div>
    <div>Inspect a page to see its DOM, styles and source here.</div>
    <div class="empty-actions">
      <button id="attach-tab" class="btn btn-primary" hidden>Inspect the page open in Cursor's browser</button>
      <button id="open-url" class="btn btn-secondary">Open URL…</button>
    </div>
  </div>
  <div id="content" style="display:none">
    <div class="devtools-bar" id="devtools-bar">
      <button class="dt-inspect-btn" id="dt-inspect" title="Inspect element (⌘⇧I)">
        <svg viewBox="0 0 16 16"><path d="M1 1v14h14V1H1zm1 1h12v12H2V2zm2 2v2h1V5h1V4H4zm5 0v1h1v1h1V4H9zM7 7v2h2V7H7zm-3 3v2h2v-1H5v-1H4zm6 0v1h-1v1h2v-2h-1z"/></svg>
      </button>
      <button class="dt-tab active" data-tab="tab-elements" data-label="Elements">Elements</button>
      <button class="dt-tab" data-tab="tab-styles" data-label="Styles">Styles</button>
      <button class="dt-tab" data-tab="tab-computed" data-label="Computed">Computed</button>
    </div>

    <div class="dt-panel active" id="tab-elements">
      <div id="dom-tree"></div>
    </div>

    <div class="dt-panel" id="tab-styles">
      <div class="section" id="active-styles"></div>
    </div>

    <div class="dt-panel" id="tab-computed">
      <div class="section" id="computed-box-model"></div>
      <div class="section" id="computed-styles"></div>
    </div>

  </div>
  <div class="bottom-bar">
    <button id="detach" class="btn btn-danger" hidden title="Remove the inspector from the page and disconnect">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M6 2h6a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H6v-1.5h5.5v-9H6V2zM5.8 5.2L3 8l2.8 2.8 1.06-1.06-.99-.99H10v-1.5H5.87l.99-.99L5.8 5.2z"/></svg>
      <span>Detach from current page</span>
    </button>
    <div class="bottom-meta">
      <span id="page-status" class="page-status" hidden></span>
      <span class="version-label" title="Installed DOM Inspector build">DOM Inspector {{version}}</span>
    </div>
  </div>
<script>
{{script}}</script>
</body>
</html>
